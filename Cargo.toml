[package]
name = "snapcoin-db-inspector"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
axum = { version = "0.8.8", features = ["ws"] }
bincode = "2"
clap = { version = "4.5.60", features = ["derive"] }
futures-util = "0.3.32"
hex = "0.4.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sled = "0.34.7"
snap-coin = { version = "13.3.0", path = "../snap-coin" }
tokio = { version = "1.49.0", features = ["full"] }
tower-http = { version = "0.5", features = ["fs"] }